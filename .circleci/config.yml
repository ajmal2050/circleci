version: 2.1

# Reusable executor configuration
executors:
  node-env:
    docker:
      - image: cimg/node:20.12.0
    working_directory: ~/project

jobs:
  # -------------------------------------------------------------
  # Job 1: Setup & Dependency Cache
  # -------------------------------------------------------------
  install-dependencies:
    executor: node-env
    steps:
      - checkout
      - restore_cache:
          name: Restore npm dependencies cache
          keys:
            - npm-deps-{{ checksum "package.json" }}
            - npm-deps-
      - run:
          name: Install npm packages
          command: npm install
      - save_cache:
          name: Cache npm dependencies
          paths:
            - node_modules
          key: npm-deps-{{ checksum "package.json" }}
      - persist_to_workspace:
          root: ~/project
          paths:
            - .

  # -------------------------------------------------------------
  # Parallel Test 1: Backend Unit Tests
  # -------------------------------------------------------------
  test-backend-unit:
    executor: node-env
    steps:
      - attach_workspace:
          at: ~/project
      - run:
          name: Prepare results folder
          command: mkdir -p test-results/backend-unit
      - run:
          name: Run Backend Unit Tests
          command: npm run test:backend:unit
      - store_test_results:
          path: test-results
      - store_artifacts:
          path: test-results/backend-unit
          destination: backend-unit-reports

  # -------------------------------------------------------------
  # Parallel Test 2: Backend Integration Tests
  # -------------------------------------------------------------
  test-backend-integration:
    executor: node-env
    steps:
      - attach_workspace:
          at: ~/project
      - run:
          name: Prepare results folder
          command: mkdir -p test-results/backend-integration
      - run:
          name: Run Backend Integration Tests
          command: npm run test:backend:integration
      - store_test_results:
          path: test-results
      - store_artifacts:
          path: test-results/backend-integration
          destination: backend-integration-reports

  # -------------------------------------------------------------
  # Parallel Test 3: Frontend DOM Tests
  # -------------------------------------------------------------
  test-frontend-dom:
    executor: node-env
    steps:
      - attach_workspace:
          at: ~/project
      - run:
          name: Prepare results folder
          command: mkdir -p test-results/frontend-dom
      - run:
          name: Run Frontend DOM Tests
          command: npm run test:frontend:dom
      - store_test_results:
          path: test-results
      - store_artifacts:
          path: test-results/frontend-dom
          destination: frontend-dom-reports

  # -------------------------------------------------------------
  # Parallel Test 4: Frontend State Tests
  # -------------------------------------------------------------
  test-frontend-state:
    executor: node-env
    steps:
      - attach_workspace:
          at: ~/project
      - run:
          name: Prepare results folder
          command: mkdir -p test-results/frontend-state
      - run:
          name: Run Frontend State Tests
          command: npm run test:frontend:state
      - store_test_results:
          path: test-results
      - store_artifacts:
          path: test-results/frontend-state
          destination: frontend-state-reports

# =============================================================
# WORKFLOW: Displays 4 parallel branches in the UI DAG diagram
# =============================================================
workflows:
  version: 2
  fullstack-4-parallel-tests:
    jobs:
      - install-dependencies
      # All 4 tests depend ONLY on install-dependencies, triggering simultaneously
      - test-backend-unit:
          requires:
            - install-dependencies
      - test-backend-integration:
          requires:
            - install-dependencies
      - test-frontend-dom:
          requires:
            - install-dependencies
      - test-frontend-state:
          requires:
            - install-dependencies