version: 2.1

executors:
  node-env:
    docker:
      - image: cimg/node:20.12.0
    working_directory: ~/project

jobs:
  install-dependencies:
    executor: node-env
    steps:
      - checkout
      - restore_cache:
          keys:
            - npm-deps-{{ checksum "package.json" }}
            - npm-deps-
      - run:
          name: Install dependencies
          command: npm install
      - save_cache:
          paths:
            - node_modules
          key: npm-deps-{{ checksum "package.json" }}
      - persist_to_workspace:
          root: ~/project
          paths:
            - .

  test-backend:
    executor: node-env
    steps:
      - attach_workspace:
          at: ~/project
      - run:
          name: Create Results Directory
          command: mkdir -p test-results/backend
      - run:
          name: Run Backend Tests
          command: npm run test:backend > test-results/backend/results.xml
      - store_test_results:
          path: test-results
      - store_artifacts:
          path: test-results/backend
          destination: backend-xml

  test-frontend:
    executor: node-env
    steps:
      - attach_workspace:
          at: ~/project
      - run:
          name: Create Results Directory
          command: mkdir -p test-results/frontend
      - run:
          name: Run Frontend Tests
          command: npm run test:frontend > test-results/frontend/results.xml
      - store_test_results:
          path: test-results
      - store_artifacts:
          path: test-results/frontend
          destination: frontend-xml

workflows:
  version: 2
  build-and-test:
    jobs:
      - install-dependencies
      - test-backend:
          requires:
            - install-dependencies
      - test-frontend:
          requires:
            - install-dependencies