version: 2.1

executors:
  node-env:
    docker:
      - image: cimg/node:20.12.0
    working_directory: ~/project

jobs:
  # -----------------------------------------------------------------
  # Base Setup: Dependencies installation and caching
  # -----------------------------------------------------------------
  install-dependencies:
    executor: node-env
    steps:
      - checkout
      - restore_cache:
          name: Restore cached node_modules
          keys:
            - npm-deps-{{ checksum "package.json" }}
            - npm-deps-
      - run:
          name: Install dependencies
          command: npm install
      - save_cache:
          name: Cache node_modules
          paths:
            - node_modules
          key: npm-deps-{{ checksum "package.json" }}
      - persist_to_workspace:
          root: ~/project
          paths:
            - .

  # -----------------------------------------------------------------
  # 4 Visual Parallel Test Blocks
  # -----------------------------------------------------------------
  test-backend-unit:
    executor: node-env
    steps:
      - attach_workspace:
          at: ~/project
      - run:
          name: Prepare results folder
          command: mkdir -p test-results/backend-unit
      - run:
          name: Run Backend Unit Tests
          command: npm run test:backend-unit
      - store_test_results:
          path: test-results
      - store_artifacts:
          path: test-results/backend-unit
          destination: backend-unit-reports

  test-backend-integration:
    executor: node-env
    steps:
      - attach_workspace:
          at: ~/project
      - run:
          name: Prepare results folder
          command: mkdir -p test-results/backend-integration
      - run:
          name: Run Backend Integration Tests
          command: npm run test:backend-integration
      - store_test_results:
          path: test-results
      - store_artifacts:
          path: test-results/backend-integration
          destination: backend-integration-reports

  test-frontend-dom:
    executor: node-env
    steps:
      - attach_workspace:
          at: ~/project
      - run:
          name: Prepare results folder
          command: mkdir -p test-results/frontend-dom
      - run:
          name: Run Frontend DOM Tests
          command: npm run test:frontend-dom
      - store_test_results:
          path: test-results
      - store_artifacts:
          path: test-results/frontend-dom
          destination: frontend-dom-reports

  test-frontend-state:
    executor: node-env
    steps:
      - attach_workspace:
          at: ~/project
      - run:
          name: Prepare results folder
          command: mkdir -p test-results/frontend-state
      - run:
          name: Run Frontend State Tests
          command: npm run test:frontend-state
      - store_test_results:
          path: test-results
      - store_artifacts:
          path: test-results/frontend-state
          destination: frontend-state-reports

  # -----------------------------------------------------------------
  # Step 1: Pre-Deploy Validation (Runs BEFORE Deploy)
  # -----------------------------------------------------------------
  pre-deploy-validation:
    executor: node-env
    steps:
      - attach_workspace:
          at: ~/project
      - run:
          name: Validate Code Integrity and Configurations
          command: |
            echo "=== Step 1: Pre-Deployment Validation ==="
            # 1. Verify build files exist
            if [ ! -f "backend/server.js" ] || [ ! -d "frontend" ]; then
              echo "Error: Required deployment files are missing!"
              exit 1
            fi

            # 2. Dry-run server initialization check
            node -e "require('./backend/server.js'); console.log('Server code parsed without syntax errors.'); process.exit(0);"

            # 3. Save current release target version
            echo "TARGET_RELEASE_COMMIT=$CIRCLE_SHA1" > release_metadata.env
            echo "PREV_RELEASE_COMMIT=$(git rev-parse HEAD~1)" >> release_metadata.env
            echo "Pre-deploy validation passed. Safe to deploy."
      - persist_to_workspace:
          root: ~/project
          paths:
            - release_metadata.env

  # -----------------------------------------------------------------
  # Step 2: Deployment
  # -----------------------------------------------------------------
  deploy:
    executor: node-env
    steps:
      - attach_workspace:
          at: ~/project
      - run:
          name: Plan deployment
          command: |
            circleci run release plan "${CIRCLE_JOB}" \
              --environment-name="production" \
              --component-name="${CIRCLE_PROJECT_REPONAME}" \
              --target-version="${TARGET_RELEASE_COMMIT}"
      - run:
          name: Execute Production Release
          command: |
            echo "=== Step 2: Deploying Application ==="
            if [ -f release_metadata.env ]; then
              source release_metadata.env
              echo "Releasing version commit: $TARGET_RELEASE_COMMIT"
            fi
            # Place deployment CLI commands here (Docker, Render webhook, SSH, AWS S3/EC2)
            echo "Deployment execution finished successfully."
      - run:
          name: Update deployment status to failed
          command: circleci run release update "${CIRCLE_JOB}" --status=FAILED
          when: on_fail

  # -----------------------------------------------------------------
  # Step 3: Smart Deployment Monitoring & Conditional Rollback
  # -----------------------------------------------------------------
  smart-deploy-monitor:
    executor: node-env
    steps:
      - attach_workspace:
          at: ~/project
      - run:
          name: Active Monitoring Probes & Webhook Validation
          command: |
            echo "=== Step 3: Smart Deployment Monitoring ==="
            
            # Start background instance to probe live endpoint
            node backend/server.js &
            APP_PID=$!
            sleep 3

            echo "Probing /api/status endpoint..."
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/api/status || echo "000")
            echo "Received status: $HTTP_STATUS"

            if [ "$HTTP_STATUS" != "200" ]; then
              echo "Monitoring Alert: Health check failed with status $HTTP_STATUS"
              kill -9 $APP_PID || true
              exit 1
            fi

            kill -9 $APP_PID || true
            echo "Health status verified: 200 OK."

            # Post-deployment monitoring webhook trigger
            if [ -n "$MONITORING_WEBHOOK_URL" ]; then
              echo "Sending deployment status event to monitoring webhook..."
              curl -s -X POST -H "Content-Type: application/json" \
                -d "{\"event\":\"deployment_healthy\",\"commit\":\"$CIRCLE_SHA1\",\"pipeline_id\":\"$CIRCLE_WORKFLOW_ID\"}" \
                "$MONITORING_WEBHOOK_URL"
            else
              echo "MONITORING_WEBHOOK_URL not set. Internal monitoring probes passed."
            fi

      # Rollback runs ONLY IF monitoring checks fail
      - run:
          name: Automated Rollback on Monitoring Failure
          when: on_fail
          command: |
            echo "=========================================================="
            echo "ALERT: Monitoring checks failed! Triggering automatic rollback."
            echo "=========================================================="
            if [ -f release_metadata.env ]; then
              source release_metadata.env
              echo "Reverting production traffic to previous stable commit: $PREV_RELEASE_COMMIT"
            fi
            echo "Rollback completed."

# -----------------------------------------------------------------
# Workflow Orchestration
# -----------------------------------------------------------------
  deploy-release:
    type: release
    plan_name: deploy
    validation:
      enabled: true
      auto_rollback_on_failure: true
workflows:
  version: 2
  build-validate-deploy-and-monitor:
    jobs:
      - install-dependencies

      # 4 Tests run simultaneously side-by-side
      - test-backend-unit:
          requires:
            - install-dependencies
      - test-backend-integration:
          requires:
            - install-dependencies
      - test-frontend-dom:
          requires:
            - install-dependencies
      - test-frontend-state:
          requires:
            - install-dependencies

      # 1. Validate First: Requires all 4 test blocks to pass
      - pre-deploy-validation:
          requires:
            - test-backend-unit
            - test-backend-integration
            - test-frontend-dom
            - test-frontend-state

      # 2. Deploy: Strictly waits for validation to pass
      - deploy:
          requires:
            - pre-deploy-validation

      # 3. Monitor in Smart Deployment: Runs after deploy
      - deploy-release:
          requires:
            - deploy
      - smart-deploy-monitor:
          requires:
            - deploy