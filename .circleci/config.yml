version: 2.1

executors:
  node-env:
    docker:
      - image: cimg/node:20.12.0
    working_directory: ~/project

jobs:
  # -----------------------------------------------------------------
  # Base Setup: Dependencies installation and caching
  # -----------------------------------------------------------------
  install-dependencies:
    executor: node-env
    steps:
      - checkout
      - restore_cache:
          name: Restore cached node_modules
          keys:
            - npm-deps-{{ checksum "package.json" }}
            - npm-deps-
      - run:
          name: Install dependencies
          command: npm install
      - save_cache:
          name: Cache node_modules
          paths:
            - node_modules
          key: npm-deps-{{ checksum "package.json" }}
      - persist_to_workspace:
          root: ~/project
          paths:
            - .

  # -----------------------------------------------------------------
  # Visual Test Block 1: Backend Unit Tests
  # -----------------------------------------------------------------
  test-backend-unit:
    executor: node-env
    steps:
      - attach_workspace:
          at: ~/project
      - run:
          name: Prepare results folder
          command: mkdir -p test-results/backend-unit
      - run:
          name: Run Backend Unit Tests
          command: npm run test:backend-unit
      - store_test_results:
          path: test-results
      - store_artifacts:
          path: test-results/backend-unit
          destination: backend-unit-reports

  # -----------------------------------------------------------------
  # Visual Test Block 2: Backend Integration Tests
  # -----------------------------------------------------------------
  test-backend-integration:
    executor: node-env
    steps:
      - attach_workspace:
          at: ~/project
      - run:
          name: Prepare results folder
          command: mkdir -p test-results/backend-integration
      - run:
          name: Run Backend Integration Tests
          command: npm run test:backend-integration
      - store_test_results:
          path: test-results
      - store_artifacts:
          path: test-results/backend-integration
          destination: backend-integration-reports

  # -----------------------------------------------------------------
  # Visual Test Block 3: Frontend DOM Tests
  # -----------------------------------------------------------------
  test-frontend-dom:
    executor: node-env
    steps:
      - attach_workspace:
          at: ~/project
      - run:
          name: Prepare results folder
          command: mkdir -p test-results/frontend-dom
      - run:
          name: Run Frontend DOM Tests
          command: npm run test:frontend-dom
      - store_test_results:
          path: test-results
      - store_artifacts:
          path: test-results/frontend-dom
          destination: frontend-dom-reports

  # -----------------------------------------------------------------
  # Visual Test Block 4: Frontend State Tests
  # -----------------------------------------------------------------
  test-frontend-state:
    executor: node-env
    steps:
      - attach_workspace:
          at: ~/project
      - run:
          name: Prepare results folder
          command: mkdir -p test-results/frontend-state
      - run:
          name: Run Frontend State Tests
          command: npm run test:frontend-state
      - store_test_results:
          path: test-results
      - store_artifacts:
          path: test-results/frontend-state
          destination: frontend-state-reports

  # -----------------------------------------------------------------
  # Smart Deployment Stage: Release Application
  # -----------------------------------------------------------------
  deploy:
    executor: node-env
    steps:
      - attach_workspace:
          at: ~/project
      - run:
          name: Deploy Release to Production
          command: |
            echo "All 4 test suites passed successfully."
            echo "Deploying application commit: $CIRCLE_SHA1"
            # Command to deploy (e.g. AWS CLI, Docker push, webhook deploy hook)
            echo "PREVIOUS_STABLE_COMMIT=$(git rev-parse HEAD~1)" > deploy_state.env
      - persist_to_workspace:
          root: ~/project
          paths:
            - deploy_state.env

  # -----------------------------------------------------------------
  # Smart Deployment Stage: Validate via Probes & Monitoring Webhook
  # -----------------------------------------------------------------
  validate-deployment:
    executor: node-env
    steps:
      - attach_workspace:
          at: ~/project
      - run:
          name: Automated Health Checks & Webhook Monitoring
          command: |
            echo "=== Validating Deployment Release ==="
            # Simulate endpoint probe (Replace URL with your live service URL)
            TARGET_URL="http://localhost:3000/api/status"
            
            # Start background server for verification
            node backend/server.js &
            SERVER_PID=$!
            sleep 3

            echo "Sending health check request to $TARGET_URL..."
            STATUS_CODE=$(curl -s -o response.json -w "%{http_code}" "$TARGET_URL" || echo "000")

            if [ "$STATUS_CODE" != "200" ]; then
              echo "Error: Health check failed with HTTP status $STATUS_CODE"
              kill -9 $SERVER_PID || true
              exit 1
            fi

            echo "Health check probe passed with status 200!"
            kill -9 $SERVER_PID || true

            # Trigger CircleCI / Monitoring webhook notification
            if [ -n "$MONITORING_WEBHOOK_URL" ]; then
              echo "Dispatching validation event to monitoring webhook..."
              curl -s -X POST -H "Content-Type: application/json" \
                -d "{\"status\":\"healthy\",\"pipeline_id\":\"$CIRCLE_WORKFLOW_ID\",\"commit\":\"$CIRCLE_SHA1\"}" \
                "$MONITORING_WEBHOOK_URL"
            fi

  # -----------------------------------------------------------------
  # Smart Deployment Stage: Automated Rollback on Failure
  # -----------------------------------------------------------------
  rollback:
    executor: node-env
    steps:
      - attach_workspace:
          at: ~/project
      - run:
          name: Execute Automated Rollback
          command: |
            echo "=========================================================="
            echo "WARNING: Health checks or monitoring validation failed!"
            echo "Initiating automated rollback to previous stable commit..."
            echo "=========================================================="
            if [ -f deploy_state.env ]; then
              source deploy_state.env
              echo "Rolling back deployment to commit: $PREVIOUS_STABLE_COMMIT"
            fi
            # Insert cloud rollback command here (e.g., re-deploy previous tag or image)
            echo "Rollback sequence completed successfully."

# -----------------------------------------------------------------
# Workflow Layout
# -----------------------------------------------------------------
workflows:
  version: 2
  build-test-and-smart-deploy:
    jobs:
      - install-dependencies

      # 4 Parallel Test Blocks
      - test-backend-unit:
          requires:
            - install-dependencies
      - test-backend-integration:
          requires:
            - install-dependencies
      - test-frontend-dom:
          requires:
            - install-dependencies
      - test-frontend-state:
          requires:
            - install-dependencies

      # Deploy proceeds only after all 4 test blocks turn green
      - deploy:
          requires:
            - test-backend-unit
            - test-backend-integration
            - test-frontend-dom
            - test-frontend-state

      # Post-release validation checks live service health
      - validate-deployment:
          requires:
            - deploy

      # Auto rollback triggers only if validation fails
      - rollback:
          requires:
            - validate-deployment
          # Ensures this job runs only if validate-deployment failed
          # (Configured via CircleCI or status check routing)


          