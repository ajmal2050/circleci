version: 2.1

executors:
  node-env:
    docker:
      - image: cimg/node:20.12.0
    working_directory: ~/project

jobs:
  # -----------------------------------------------------------------
  # Base Setup: Installs and caches dependencies
  # -----------------------------------------------------------------
  install-dependencies:
    executor: node-env
    steps:
      - checkout
      - restore_cache:
          name: Restore cached node_modules
          keys:
            - npm-deps-{{ checksum "package.json" }}
            - npm-deps-
      - run:
          name: Install dependencies
          command: npm install
      - save_cache:
          name: Cache node_modules
          paths:
            - node_modules
          key: npm-deps-{{ checksum "package.json" }}
      - persist_to_workspace:
          root: ~/project
          paths:
            - .

  # -----------------------------------------------------------------
  # Block 1: Backend Unit Tests
  # -----------------------------------------------------------------
  test-backend-unit:
    executor: node-env
    steps:
      - attach_workspace:
          at: ~/project
      - run:
          name: Prepare results folder
          command: mkdir -p test-results/backend-unit
      - run:
          name: Run Backend Unit Tests
          command: npm run test:backend-unit
      - store_test_results:
          path: test-results
      - store_artifacts:
          path: test-results/backend-unit
          destination: backend-unit-reports

  # -----------------------------------------------------------------
  # Block 2: Backend Integration Tests
  # -----------------------------------------------------------------
  test-backend-integration:
    executor: node-env
    steps:
      - attach_workspace:
          at: ~/project
      - run:
          name: Prepare results folder
          command: mkdir -p test-results/backend-integration
      - run:
          name: Run Backend Integration Tests
          command: npm run test:backend-integration
      - store_test_results:
          path: test-results
      - store_artifacts:
          path: test-results/backend-integration
          destination: backend-integration-reports

  # -----------------------------------------------------------------
  # Block 3: Frontend DOM Tests
  # -----------------------------------------------------------------
  test-frontend-dom:
    executor: node-env
    steps:
      - attach_workspace:
          at: ~/project
      - run:
          name: Prepare results folder
          command: mkdir -p test-results/frontend-dom
      - run:
          name: Run Frontend DOM Tests
          command: npm run test:frontend-dom
      - store_test_results:
          path: test-results
      - store_artifacts:
          path: test-results/frontend-dom
          destination: frontend-dom-reports

  # -----------------------------------------------------------------
  # Block 4: Frontend State Tests
  # -----------------------------------------------------------------
  test-frontend-state:
    executor: node-env
    steps:
      - attach_workspace:
          at: ~/project
      - run:
          name: Prepare results folder
          command: mkdir -p test-results/frontend-state
      - run:
          name: Run Frontend State Tests
          command: npm run test:frontend-state
      - store_test_results:
          path: test-results
      - store_artifacts:
          path: test-results/frontend-state
          destination: frontend-state-reports

  # -----------------------------------------------------------------
  # Deploy Block: Executes only when all 4 test blocks pass
  # -----------------------------------------------------------------
  deploy:
    executor: node-env
    steps:
      - attach_workspace:
          at: ~/project
      - run:
          name: Execute Production Deploy
          command: |
            echo "All 4 test suites passed successfully!"
            echo "Deploying application to production..."

# -----------------------------------------------------------------
# Workflow Graph Layout
# -----------------------------------------------------------------
workflows:
  version: 2
  build-test-and-deploy:
    jobs:
      - install-dependencies

      # All 4 test blocks execute simultaneously side-by-side
      - test-backend-unit:
          requires:
            - install-dependencies
      - test-backend-integration:
          requires:
            - install-dependencies
      - test-frontend-dom:
          requires:
            - install-dependencies
      - test-frontend-state:
          requires:
            - install-dependencies

      # Deployment executes strictly when all 4 test blocks turn green
      - deploy:
          requires:
            - test-backend-unit
            - test-backend-integration
            - test-frontend-dom
            - test-frontend-state