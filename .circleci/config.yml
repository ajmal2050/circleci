version: 2.1

executors:
  node-env:
    docker:
      - image: cimg/node:20.12.0
    working_directory: ~/project

jobs:
  install-dependencies:
    executor: node-env
    steps:
      - checkout
      - restore_cache:
          name: Restore cached node_modules
          keys:
            - npm-deps-{{ checksum "package.json" }}
            - npm-deps-
      - run:
          name: Install dependencies
          command: npm install
      - save_cache:
          name: Cache node_modules
          paths:
            - node_modules
          key: npm-deps-{{ checksum "package.json" }}
      - persist_to_workspace:
          root: ~/project
          paths:
            - .

  # Block 1
  test-backend:
    executor: node-env
    steps:
      - attach_workspace:
          at: ~/project
      - run:
          name: Prepare results directory
          command: mkdir -p test-results/backend
      - run:
          name: Run Backend Test Suite
          command: npm run test:backend
      - store_test_results:
          path: test-results
      - store_artifacts:
          path: test-results/backend
          destination: backend-reports

  # Block 2
  test-frontend:
    executor: node-env
    steps:
      - attach_workspace:
          at: ~/project
      - run:
          name: Prepare results directory
          command: mkdir -p test-results/frontend
      - run:
          name: Run Frontend Test Suite
          command: npm run test:frontend
      - store_test_results:
          path: test-results
      - store_artifacts:
          path: test-results/frontend
          destination: frontend-reports

  # Block 3
  test-frontend-dom:
    executor: node-env
    steps:
      - attach_workspace:
          at: ~/project
      - run:
          name: Prepare results directory
          command: mkdir -p test-results/frontend-dom
      - run:
          name: Run Frontend DOM Test Suite
          command: npm run test:frontend-dom
      - store_test_results:
          path: test-results
      - store_artifacts:
          path: test-results/frontend-dom
          destination: frontend-dom-reports

  # Block 4
  test-extra:
    executor: node-env
    steps:
      - attach_workspace:
          at: ~/project
      - run:
          name: Prepare results directory
          command: mkdir -p test-results/extra
      - run:
          name: Run Extra Test Suite
          command: npm run test:extra
      - store_test_results:
          path: test-results
      - store_artifacts:
          path: test-results/extra
          destination: extra-reports

  # Deploy Block
  deploy:
    executor: node-env
    steps:
      - attach_workspace:
          at: ~/project
      - run:
          name: Execute Production Deploy
          command: |
            echo "All 4 test suites passed successfully!"
            echo "Deploying application to production..."

workflows:
  version: 2
  build-test-and-deploy:
    jobs:
      - install-dependencies

      # All 4 test blocks execute in parallel
      - test-backend:
          requires:
            - install-dependencies
      - test-frontend:
          requires:
            - install-dependencies
      - test-frontend-dom:
          requires:
            - install-dependencies
      - test-extra:
          requires:
            - install-dependencies

      # Deploy waits until all 4 test blocks are green
      - deploy:
          requires:
            - test-backend
            - test-frontend
            - test-frontend-dom
            - test-extra