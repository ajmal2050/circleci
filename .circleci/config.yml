version: 2.1

executors:
  node-env:
    docker:
      - image: cimg/node:20.12.0
    working_directory: ~/project

jobs:
  install-dependencies:
    executor: node-env
    steps:
      - checkout
      - restore_cache:
          name: Restore cached node_modules
          keys:
            - npm-deps-{{ checksum "package.json" }}
            - npm-deps-
      - run:
          name: Install dependencies
          command: npm install
      - save_cache:
          name: Cache node_modules
          paths:
            - node_modules
          key: npm-deps-{{ checksum "package.json" }}
      - persist_to_workspace:
          root: ~/project
          paths:
            - .

  run-tests-parallel:
    executor: node-env
    parallelism: 4 # Provisions 4 containers running at the same time
    steps:
      - attach_workspace:
          at: ~/project
      - run:
          name: Prepare results directory
          command: mkdir -p test-results/junit
      - run:
          name: Run Split Tests Across 4 Parallel Nodes
          command: |
            # Automatically discovers all 4 test files and maps 1 file to each node
            TEST_FILES=$(circleci tests glob "test/**/*.test.js" | circleci tests split --split-by=timings)
            echo "========================================================"
            echo "Node $CIRCLE_NODE_INDEX of $CIRCLE_NODE_TOTAL is running:"
            echo "$TEST_FILES"
            echo "========================================================"
            npm run test:parallel -- --test-reporter-destination="test-results/junit/results-${CIRCLE_NODE_INDEX}.xml" $TEST_FILES
      - store_test_results:
          path: test-results
      - store_artifacts:
          path: test-results/junit
          destination: parallel-test-results

  deploy:
    executor: node-env
    steps:
      - attach_workspace:
          at: ~/project
      - run:
          name: Execute Production Deploy
          command: |
            echo "All 4 parallel test nodes passed successfully!"
            echo "Deploying application to production..."

workflows:
  version: 2
  build-test-and-deploy:
    jobs:
      - install-dependencies
      - run-tests-parallel:
          requires:
            - install-dependencies
      - deploy:
          requires:
            - run-tests-parallel